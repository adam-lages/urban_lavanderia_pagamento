; Firmware da placa ESP32 (um dispositivo por máquina).
; Escolha o ambiente conforme o "driver de liberação":
;   esp32doit-mock    -> LED onboard (teste de Wi-Fi/MQTT sem ligar nada na máquina)
;   esp32doit-serial  -> chicote de CARTÃO (ESDUS): UART2 SNIFFER (só escuta; sem frames)
;   esp32doit-gpio    -> plano B: pulso 50 ms (moeda Cndr=0) ou Start, via opto; NÃO 220 V
;   native            -> testes unitários no PC (pio test -e native)
; Loja Card/OPL (CWG27MDCRS): o chicote plug-in é serial de cartão, não moeda.

[env]
monitor_speed = 115200

[esp32_common]
framework = arduino
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0\"

[env:esp32doit-mock]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DRELEASE_DRIVER=0

[env:esp32doit-gpio]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DRELEASE_DRIVER=1
    -DGPIO_RELEASE_PIN=26
    -DGPIO_ACTIVE_LEVEL=HIGH
    -DGPIO_PULSE_MS=50

[env:esp32doit-serial]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DRELEASE_DRIVER=2
    -DSERIAL_RX_PIN=16
    -DSERIAL_TX_PIN=17
    -DSERIAL_BAUD=9600
    -DSERIAL_FORMAT=SERIAL_8N1
    -DSERIAL_DEBUG_TX=0

[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.0.4
test_framework = unity
build_flags = -std=gnu++17
