; Firmware Alliance / Speed Queen (STENXASP543DN01, Quantum Gold).
; Uma ESP32 por lado do stack (lavar e secar).
;   esp32doit-mock   -> LED onboard (Wi-Fi/MQTT sem ligar na máquina)
;   esp32doit-pulse  -> pulsos isolados no GPIO 23 (Start Pulse / H3)
;   native           -> testes no PC (pio test -e native)
; Não use firmware-lg/ (LG Giant C) nesta máquina.

[env]
monitor_speed = 115200

[esp32_common]
framework = arduino
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0-alliance\"

[env:esp32doit-mock]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DRELEASE_DRIVER=0

[env:esp32doit-pulse]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DRELEASE_DRIVER=1
    -DGPIO_RELEASE_PIN=23
    -DGPIO_ACTIVE_LEVEL=HIGH
    -DGPIO_PULSE_MS=50
    -DGPIO_GAP_MS=50

[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.0.4
test_framework = unity
build_flags = -std=gnu++17
